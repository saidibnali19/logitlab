<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    /* The brand colour in each theme (emerald-700, then emerald-400 in dark). A tab icon cannot read the page's CSS variables. */
    rect { fill: #007a55; }
    @media (prefers-color-scheme: dark) { rect { fill: #00d492; } }
  </style>
  <rect x="2" y="13" width="5" height="9" rx="1.5" />
  <rect x="9.5" y="8" width="5" height="14" rx="1.5" />
  <rect x="17" y="2" width="5" height="20" rx="1.5" />
</svg>
